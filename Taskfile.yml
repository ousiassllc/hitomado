version: '3'

vars:
  APP_NAME: "hitomado"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: "bun"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows:
    taskfile: ./build/windows/Taskfile.yml
    # 版の既定値（main.go の version・build/config.yml と揃える）。コマンドラインの VERSION を上書きとして使うため、ここで定義する。
    vars:
      APP_VERSION: '{{.VERSION | default "0.0.0"}}'
  # macOS 版（.app の zip）。windows と同じ理由で APP_VERSION をここに置く。macOS 上でだけ動かす（README.md「macOS」）。
  darwin:
    taskfile: ./build/darwin/Taskfile.yml
    vars:
      APP_VERSION: '{{.VERSION | default "0.0.0"}}'
  # Android 版（docs/environment/android.md）。APP_ID は build/config.yml の productIdentifier と同じ。
  # APP_VERSION は windows と同じ理由でここに置く（VERSION を渡さなければ 0.0.0）。versionName・versionCode は VERSION から決まる。
  android:
    taskfile: ./build/android/Taskfile.yml
    vars:
      APP_ID: jp.ousias.hitomado
      APP_VERSION: '{{.VERSION | default "0.0.0"}}'

tasks:
  build:
    summary: Builds the application (Windows exe / macOS executable, by the host OS)
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Builds the Windows installer / the macOS .app and zip (VERSION=X.Y.Z)
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  generate:
    summary: Regenerates sqlc code and the Wails bindings
    cmds:
      - sqlc generate
      - task: common:generate:bindings

  lint:
    summary: Runs every linter and the type check
    cmds:
      - golangci-lint run
      - cmd: bunx biome ci .
        dir: frontend
      - cmd: bun run typecheck
        dir: frontend
      - bunx linterly check

  fmt:
    summary: Formats Go and frontend sources
    cmds:
      - golangci-lint fmt
      - cmd: bunx biome format --write .
        dir: frontend

  test:
    summary: Runs the Go and frontend tests
    cmds:
      - go test ./...
      - cmd: bun test
        dir: frontend

  check:
    summary: Same checks as CI (generated files must be up to date)
    cmds:
      - task: generate
      - git diff --exit-code
      - task: lint
      - task: test
