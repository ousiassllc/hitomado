version: '3'

includes:
  common: ../Taskfile.yml

vars:
  APP_ID: '{{.APP_ID | default "com.wails.app"}}'
  # minSdk。app/build.gradle の minSdk と同じ値にする（ここでは NDK の clang の API レベルに使う）。
  # compileSdk / targetSdk は app/build.gradle の 1 か所だけで決める（36。理由は docs/environment/android.md）。
  MIN_SDK: '21'
  # 使う NDK。ANDROID_NDK_HOME があればそれを優先し、無ければ $SDK_ROOT/ndk/<この版>。最新の NDK を自動で選ぶことはしない。
  NDK_VERSION: '26.3.11579264'
  # VERSION=X.Y.Z（ルートの Taskfile.yml の includes（android）の vars が渡す。既定 0.0.0）。
  # versionName / versionCode の決め方は app/build.gradle と docs/environment/android.md。
  # The emulator runs the host architecture; physical devices are arm64
  HOST_ARCH:
    sh: '[ "$(uname -m)" = "x86_64" ] && echo "amd64" || echo "arm64"'
  # System-image ABI for the host, used in the "create an AVD" hint below.
  ANDROID_ABI:
    sh: '[ "$(uname -m)" = "arm64" ] && echo "arm64-v8a" || echo "x86_64"'
  # SDK location: $ANDROID_HOME / $ANDROID_SDK_ROOT, else the per-OS default
  # (macOS: ~/Library/Android/sdk, Linux/other: ~/Android/Sdk)
  SDK_ROOT:
    sh: 'echo "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$([ -d "$HOME/Library/Android/sdk" ] && echo "$HOME/Library/Android/sdk" || echo "$HOME/Android/Sdk")}}"'
  ADB:
    sh: 'command -v adb || echo "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$([ -d "$HOME/Library/Android/sdk" ] && echo "$HOME/Library/Android/sdk" || echo "$HOME/Android/Sdk")}}/platform-tools/adb"'
  EMULATOR:
    sh: 'command -v emulator || echo "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$([ -d "$HOME/Library/Android/sdk" ] && echo "$HOME/Library/Android/sdk" || echo "$HOME/Android/Sdk")}}/emulator/emulator"'
  # avdmanager lives under cmdline-tools/<version>/bin; used to auto-create an
  # AVD when none exists (mirrors the iOS `ensure-simulator` auto-create flow).
  AVDMANAGER:
    sh: 'command -v avdmanager || ls "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$([ -d "$HOME/Library/Android/sdk" ] && echo "$HOME/Library/Android/sdk" || echo "$HOME/Android/Sdk")}}"/cmdline-tools/*/bin/avdmanager 2>/dev/null | sort -V | tail -1 || true'

tasks:
  install:deps:
    summary: Check and install Android development dependencies
    cmds:
      - go run build/android/scripts/deps/install_deps.go
    env:
      TASK_FORCE_YES: '{{if .YES}}true{{else}}false{{end}}'
    prompt: This will check and install Android development dependencies. Continue?

  build:
    summary: Builds libwails.so for Android (arm64 by default; ARCH=amd64 for the x86_64 emulator)
    desc: |
      Real devices are arm64, so arm64 is the default. libwails.so for other ABIs left
      by earlier builds is removed first, so the APK only contains the requested ABI.
      The Wails bindings (frontend/bindings) are NOT regenerated here: they are generated
      only with the default tags by `task generate` (see docs/environment/android.md).
    deps:
      - task: generate:android:overlay
      - task: build:frontend
        vars:
          PRODUCTION:
            ref: .PRODUCTION
    cmds:
      - echo "Building Android app {{.APP_NAME}} {{.APP_VERSION}} ({{.ARCH | default "arm64"}})..."
      - rm -f build/android/app/src/main/jniLibs/*/libwails.so
      - task: compile:go:shared
        vars:
          ARCH: '{{.ARCH | default "arm64"}}'
          # 呼び出し先には親の変数が渡らないため明示する（渡さないと release でも debug タグ・最適化なしでビルドされる）。
          PRODUCTION: '{{.PRODUCTION | default "false"}}'
    env:
      PRODUCTION: '{{.PRODUCTION | default "false"}}'
    preconditions:
      - sh: '{{if regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+$" .APP_VERSION}}true{{else}}false{{end}}'
        msg: "VERSION must look like X.Y.Z (no leading v), got '{{.APP_VERSION}}'"

  build:frontend:
    internal: true
    summary: Builds the frontend. Unlike common:build:frontend it does not regenerate the bindings.
    run: once
    dir: frontend
    deps:
      - task: common:install:frontend:deps
    cmds:
      - bun run {{if eq .PRODUCTION "true"}}build{{else}}build:dev{{end}}
    env:
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  compile:go:shared:
    summary: Compile Go code to shared library (.so)
    cmds:
      - |
        # Locate the NDK: $ANDROID_NDK_HOME, else the pinned version under the SDK
        NDK_ROOT="$ANDROID_NDK_HOME"
        if [ -z "$NDK_ROOT" ]; then
          NDK_ROOT="{{.SDK_ROOT}}/ndk/{{.NDK_VERSION}}"
        fi
        if [ ! -d "$NDK_ROOT" ]; then
          echo "Error: Android NDK not found at $NDK_ROOT"
          echo "Install it with: sdkmanager 'ndk;{{.NDK_VERSION}}' (or set ANDROID_NDK_HOME)"
          exit 1
        fi

        # Determine toolchain based on host OS
        case "$(uname -s)" in
          Darwin) HOST_TAG="darwin-x86_64" ;;
          Linux)  HOST_TAG="linux-x86_64" ;;
          *)      echo "Unsupported host OS"; exit 1 ;;
        esac

        TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/$HOST_TAG"

        # Set compiler based on architecture
        case "{{.ARCH}}" in
          arm64)
            export CC="$TOOLCHAIN/bin/aarch64-linux-android{{.MIN_SDK}}-clang"
            export CXX="$TOOLCHAIN/bin/aarch64-linux-android{{.MIN_SDK}}-clang++"
            export GOARCH=arm64
            JNI_DIR="arm64-v8a"
            ;;
          amd64|x86_64)
            export CC="$TOOLCHAIN/bin/x86_64-linux-android{{.MIN_SDK}}-clang"
            export CXX="$TOOLCHAIN/bin/x86_64-linux-android{{.MIN_SDK}}-clang++"
            export GOARCH=amd64
            JNI_DIR="x86_64"
            ;;
          *)
            echo "Unsupported architecture: {{.ARCH}}"
            exit 1
            ;;
        esac

        export CGO_ENABLED=1
        export GOOS=android

        mkdir -p {{.BIN_DIR}}
        mkdir -p build/android/app/src/main/jniLibs/$JNI_DIR

        go build -buildmode=c-shared -overlay build/android/overlay.json {{.BUILD_FLAGS}} \
          -o build/android/app/src/main/jniLibs/$JNI_DIR/libwails.so
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production,android -trimpath -buildvcs=false -ldflags="-w -s -X main.version={{.APP_VERSION}}"{{else}}-tags android,debug -buildvcs=false -gcflags=all="-l"{{end}}'

  test:
    summary: Runs the Java unit tests (JVM only, no device) of build/android/app/src/test
    preconditions:
      - sh: 'command -v java >/dev/null || [ -n "$JAVA_HOME" ]'
        msg: "Java not found. Install a JDK 17 and/or set JAVA_HOME"
    cmds:
      - |
        cd build/android
        chmod +x ./gradlew
        ./gradlew -PappVersion={{.APP_VERSION}} testDebugUnitTest

  package:
    summary: Packages a production build of the application into a signed release APK
    desc: |
      Builds for arm64 by default (covers 99%+ of real devices). Set ARCH=amd64
      for emulator-only APKs, or use package:fat for a universal APK.
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: '{{.ARCH | default "arm64"}}'
    cmds:
      - task: assemble:apk:release

  package:fat:
    summary: Packages a production build for all architectures (fat APK)
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: arm64
    cmds:
      - task: compile:go:shared
        vars:
          ARCH: amd64
          PRODUCTION: "true"
      - task: assemble:apk:release

  bundle:
    summary: Packages a production AAB (Android App Bundle) for Play Store submission
    desc: |
      Builds for arm64 by default. Set ARCH=amd64 for emulator builds, or use
      bundle:fat for a universal AAB.
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: '{{.ARCH | default "arm64"}}'
    cmds:
      - task: assemble:aab:release

  bundle:fat:
    summary: Packages a production AAB for all architectures
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: arm64
    cmds:
      - task: compile:go:shared
        vars:
          ARCH: amd64
          PRODUCTION: "true"
      - task: assemble:aab:release

  signing:notice:
    internal: true
    silent: true
    summary: Prints which key the release build will be signed with (never prints a secret)
    cmds:
      - |
        if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
          echo "Signing: RELEASE key from ANDROID_KEYSTORE_FILE (alias: ${ANDROID_KEY_ALIAS:-<unset>})"
        else
          echo "WARNING: Signing: DEBUG key (ANDROID_KEYSTORE_FILE is not set)."
          echo "         This is a local-install build for your own device. It is NOT a release signature:"
          echo "         Google Play rejects it, and it cannot update an app installed with a release key."
          echo "         For a release build set ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD,"
          echo "         ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (see docs/environment/android.md)."
        fi

  assemble:apk:
    summary: Assembles a debug APK using Gradle
    preconditions:
      - sh: 'command -v java >/dev/null || [ -n "$JAVA_HOME" ]'
        msg: "Java not found. Install a JDK 17 and/or set JAVA_HOME"
    cmds:
      - |
        cd build/android
        # The exec bit is lost when gradlew is extracted from the embedded
        # build assets, so restore it before invoking the wrapper.
        chmod +x ./gradlew
        ./gradlew -PappVersion={{.APP_VERSION}} assembleDebug
        mkdir -p "../../{{.BIN_DIR}}"
        cp app/build/outputs/apk/debug/app-debug.apk "../../{{.BIN_DIR}}/{{.APP_NAME}}-debug.apk"
        echo "Debug APK created: {{.BIN_DIR}}/{{.APP_NAME}}-debug.apk"

  assemble:apk:release:
    summary: Assembles a release APK using Gradle (release key from ANDROID_KEYSTORE_FILE, else the debug key)
    preconditions:
      - sh: 'command -v java >/dev/null || [ -n "$JAVA_HOME" ]'
        msg: "Java not found. Install a JDK 17 and/or set JAVA_HOME"
    cmds:
      - task: signing:notice
      - |
        cd build/android
        # The exec bit is lost when gradlew is extracted from the embedded
        # build assets, so restore it before invoking the wrapper.
        chmod +x ./gradlew
        # Only the (non-secret) version goes on the command line. The keystore passwords are read by
        # Gradle from the environment so they never show up in `ps` or in the build log.
        ./gradlew -PappVersion={{.APP_VERSION}} assembleRelease
        mkdir -p "../../{{.BIN_DIR}}"
        cp app/build/outputs/apk/release/app-release.apk "../../{{.BIN_DIR}}/{{.APP_NAME}}.apk"
        echo "Release APK created: {{.BIN_DIR}}/{{.APP_NAME}}.apk"

  assemble:aab:
    summary: Assembles a debug AAB (Android App Bundle) using Gradle
    preconditions:
      - sh: 'command -v java >/dev/null || [ -n "$JAVA_HOME" ]'
        msg: "Java not found. Install a JDK 17 and/or set JAVA_HOME"
    cmds:
      - |
        cd build/android
        chmod +x ./gradlew
        ./gradlew -PappVersion={{.APP_VERSION}} bundleDebug
        mkdir -p "../../{{.BIN_DIR}}"
        cp app/build/outputs/bundle/debug/app-debug.aab "../../{{.BIN_DIR}}/{{.APP_NAME}}-debug.aab"
        echo "Debug AAB created: {{.BIN_DIR}}/{{.APP_NAME}}-debug.aab"

  assemble:aab:release:
    summary: Assembles a release AAB for Play Store upload (release key from ANDROID_KEYSTORE_FILE, else the debug key)
    preconditions:
      - sh: 'command -v java >/dev/null || [ -n "$JAVA_HOME" ]'
        msg: "Java not found. Install a JDK 17 and/or set JAVA_HOME"
    cmds:
      # With Play App Signing, the keystore configured here is your UPLOAD key: Google verifies
      # the upload with it, then re-signs the app with the app signing key it manages.
      - task: signing:notice
      - |
        cd build/android
        chmod +x ./gradlew
        ./gradlew -PappVersion={{.APP_VERSION}} bundleRelease
        mkdir -p "../../{{.BIN_DIR}}"
        cp app/build/outputs/bundle/release/app-release.aab "../../{{.BIN_DIR}}/{{.APP_NAME}}.aab"
        echo "Release AAB created: {{.BIN_DIR}}/{{.APP_NAME}}.aab"

  lint:
    summary: Runs golangci-lint for the android build tag (what the CI "Go lint (android)" step does)
    desc: |
      build/android/gen is created by the overlay generation and has no main of its own, so it is
      removed first (the next android:build regenerates it).
    cmds:
      - rm -rf build/android/gen build/android/overlay.json
      - cmd: golangci-lint run
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"

  verify:
    summary: Checks bin/hitomado.apk (package, version, permissions, backup, signature). Pass APK=<path> to check another file
    cmds:
      - bash build/android/scripts/verify-apk.sh "{{.APK | default (printf "%s/%s.apk" .BIN_DIR .APP_NAME)}}" "{{.APP_ID}}" "{{.APP_VERSION}}" "{{.SDK_ROOT}}"

  generate:android:overlay:
    internal: true
    summary: Generate Go build overlay that registers the Android main
    sources:
      - build/config.yml
    generates:
      - build/android/overlay.json
      - build/android/gen/main_android.gen.go
    cmds:
      - wails3 android overlay:gen -out build/android/overlay.json -config build/config.yml

  ensure-emulator:
    internal: true
    summary: Ensure Android Emulator is running
    silent: true
    cmds:
      - |
        # Check if an emulator is already running
        if "{{.ADB}}" devices | grep -q "emulator"; then
          echo "Emulator already running"
          exit 0
        fi

        # Get first available AVD
        AVD_NAME=$("{{.EMULATOR}}" -list-avds | tail -1)
        if [ -z "$AVD_NAME" ]; then
          # No AVD yet. Mirror the iOS `ensure-simulator` flow and create one
          # automatically — but ONLY from a system image that is already
          # installed. We never trigger an sdkmanager download from a `run`
          # task (that would be a surprise multi-GB download + license prompt).
          # Pick the highest-API installed image matching the host ABI.
          SDK_ROOT="{{.SDK_ROOT}}"
          ABI="{{.ANDROID_ABI}}"
          IMG=$(ls -d "$SDK_ROOT"/system-images/android-*/*/"$ABI" 2>/dev/null | sort -V | tail -1)
          AVDMANAGER="{{.AVDMANAGER}}"
          if [ -n "$IMG" ] && [ -x "$AVDMANAGER" ]; then
            PKG="system-images;$(echo "$IMG" | sed "s|$SDK_ROOT/system-images/||" | tr '/' ';')"
            echo "No Android Virtual Devices found. Creating 'wails' from $PKG..."
            echo "no" | "$AVDMANAGER" create avd --name wails --package "$PKG" --device pixel_7 --force
            AVD_NAME=wails
          else
            echo "No Android Virtual Devices found, and no system image is installed to create one from."
            echo "Install a system image and create an AVD, e.g.:"
            echo "  sdkmanager 'system-images;android-36;google_apis;$ABI'"
            echo "  avdmanager create avd --name wails --package 'system-images;android-36;google_apis;$ABI' --device pixel_7"
            exit 1
          fi
        fi

        echo "Starting emulator: $AVD_NAME"
        # Start the emulator daemonized so it outlives this task step. go-task's
        # shell tracks background jobs by PID and reaps them when the command's
        # interpreter finishes (which nohup/setsid alone don't prevent — the kill
        # is direct), so a bare `emulator &` is gone before the later
        # install/launch steps run. Launch it from a short-lived child shell that
        # backgrounds the emulator and exits immediately: the emulator is then
        # reparented to init/launchd and go-task's shell has no handle to reap it.
        nohup sh -c "'{{.EMULATOR}}' -avd '$AVD_NAME' -no-snapshot-load </dev/null >/dev/null 2>&1 &" >/dev/null 2>&1

        # Wait for emulator to boot (max 120 seconds)
        echo "Waiting for emulator to boot..."
        "{{.ADB}}" wait-for-device

        for i in $(seq 1 120); do
          BOOT_COMPLETED=$("{{.ADB}}" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
          if [ "$BOOT_COMPLETED" = "1" ]; then
            echo "Emulator booted successfully"
            exit 0
          fi
          sleep 1
        done

        echo "Emulator boot timeout"
        exit 1
    preconditions:
      - sh: '[ -x "{{.ADB}}" ] || command -v adb'
        msg: "adb not found. Install the Android SDK platform-tools (or set ANDROID_HOME)"
      - sh: '[ -x "{{.EMULATOR}}" ] || command -v emulator'
        msg: "emulator not found. Install the Android SDK emulator package (or set ANDROID_HOME)"

  deploy-emulator:
    summary: Deploy the packaged release APK to the Android Emulator
    deps:
      - task: package
        vars:
          ARCH: '{{.ARCH | default .HOST_ARCH}}'
    cmds:
      - task: ensure-emulator
      - '"{{.ADB}}" uninstall {{.APP_ID}} 2>/dev/null || true'
      - '"{{.ADB}}" install "{{.BIN_DIR}}/{{.APP_NAME}}.apk"'
      - '"{{.ADB}}" shell am start -n {{.APP_ID}}/com.wails.app.MainActivity'

  run:
    summary: Build, install and launch a debug build in the Android Emulator (host architecture)
    deps:
      - task: ensure-emulator
      - task: build
        vars:
          ARCH: '{{.ARCH | default .HOST_ARCH}}'
    cmds:
      - task: assemble:apk
      - '"{{.ADB}}" uninstall {{.APP_ID}} 2>/dev/null || true'
      - '"{{.ADB}}" install "{{.BIN_DIR}}/{{.APP_NAME}}-debug.apk"'
      - '"{{.ADB}}" shell am start -n {{.APP_ID}}/com.wails.app.MainActivity'

  device:list:
    summary: Lists connected Android devices and emulators (serials)
    cmds:
      - '"{{.ADB}}" devices -l'

  run:device:
    summary: Build, install and launch a debug build on a connected physical Android device (uninstalls the app first)
    deps:
      - task: build
        vars:
          ARCH: arm64
    vars:
      DEVICE:
        sh: |
          if [ -n "{{.DEVICE_ID}}" ]; then echo "{{.DEVICE_ID}}"; else "{{.ADB}}" devices | awk 'NR > 1 && $2 == "device" && $1 !~ /^emulator-/ { print $1; exit }'; fi
    cmds:
      - task: assemble:apk
      - |
        DEVICE='{{.DEVICE}}'
        if [ -z "$DEVICE" ]; then
          echo "Error: no connected physical Android device found."
          echo "Pass DEVICE_ID=<serial> to target a device explicitly."
          echo "Find connected device serials with: {{.ADB}} devices"
          exit 1
        fi

        echo "Deploying {{.BIN_DIR}}/{{.APP_NAME}}-debug.apk to device $DEVICE..."
        "{{.ADB}}" -s "$DEVICE" uninstall {{.APP_ID}} 2>/dev/null || true
        "{{.ADB}}" -s "$DEVICE" install "{{.BIN_DIR}}/{{.APP_NAME}}-debug.apk"
        "{{.ADB}}" -s "$DEVICE" shell am start -n {{.APP_ID}}/com.wails.app.MainActivity
    preconditions:
      - sh: '[ -x "{{.ADB}}" ] || command -v adb'
        msg: "adb not found. Install the Android SDK platform-tools (or set ANDROID_HOME)"

  install:
    summary: Installs the APK built by android:package (bin/hitomado.apk) on a connected physical device with adb
    desc: |
      Keeps the app's data (adb install -r). Run `task android:package ARCH=arm64 VERSION=X.Y.Z` first.
      DEVICE_ID=<serial> picks the device when several are connected; APK=<path> installs another file.
      An app signed with a different key cannot be replaced: uninstall it first (this deletes its data).
    vars:
      DEVICE:
        sh: |
          if [ -n "{{.DEVICE_ID}}" ]; then echo "{{.DEVICE_ID}}"; else "{{.ADB}}" devices | awk 'NR > 1 && $2 == "device" && $1 !~ /^emulator-/ { print $1; exit }'; fi
      APK_FILE: '{{.APK | default (printf "%s/%s.apk" .BIN_DIR .APP_NAME)}}'
    cmds:
      - |
        DEVICE='{{.DEVICE}}'
        if [ -z "$DEVICE" ]; then
          echo "Error: no connected physical Android device found."
          echo "Pass DEVICE_ID=<serial> to target a device explicitly."
          echo "Find connected device serials with: {{.ADB}} devices"
          exit 1
        fi
        if [ ! -f "{{.APK_FILE}}" ]; then
          echo "Error: {{.APK_FILE}} not found. Build it first: task android:package ARCH=arm64 VERSION=X.Y.Z"
          exit 1
        fi
        echo "Installing {{.APK_FILE}} on device $DEVICE..."
        if ! "{{.ADB}}" -s "$DEVICE" install -r "{{.APK_FILE}}"; then
          echo "adb install failed. INSTALL_FAILED_UPDATE_INCOMPATIBLE means the installed app was signed with a"
          echo "different key (e.g. debug vs release): uninstall it first with"
          echo "  adb -s $DEVICE uninstall {{.APP_ID}}   (this deletes the app's data)"
          exit 1
        fi
    preconditions:
      - sh: '[ -x "{{.ADB}}" ] || command -v adb'
        msg: "adb not found. Install the Android SDK platform-tools (or set ANDROID_HOME)"

  studio:
    summary: Open the generated Android project in Android Studio
    cmds:
      - |
        if command -v studio >/dev/null 2>&1; then
          studio build/android
        elif [ -d "/Applications/Android Studio.app" ]; then
          open -a "Android Studio" build/android
        else
          echo "Android Studio not found. Install it from https://developer.android.com/studio,"
          echo "then open the build/android directory."
          exit 1
        fi

  logs:
    summary: Stream Android logcat filtered to this app
    cmds:
      - '"{{.ADB}}" logcat -v time | grep -E "(Wails|{{.APP_NAME}})" || true'

  logs:all:
    summary: Stream all Android logcat (verbose)
    cmds:
      - '"{{.ADB}}" logcat -v time'

  clean:
    summary: Clean build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -rf build/android/app/build
      - rm -rf build/android/app/src/main/jniLibs/*/libwails.so
      - rm -rf build/android/.gradle
