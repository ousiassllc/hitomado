name: Build the Windows installer
description: >-
  windows-latest で hitomado.exe と NSIS インストーラー bin/hitomado-v<version>-windows-amd64-setup.exe を作る。
  呼び出し側で actions/checkout を済ませておく。CI とリリースで同じ手順を使うためのもの。
inputs:
  version:
    description: 版番号。X.Y.Z でも vX.Y.Z（タグ）でもよい（先頭の v は外す）。exe の -X main.version・ファイルバージョン・インストーラーの表示に入る
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - name: Install tools
      shell: bash
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@"${WAILS_VERSION}"
    - name: Install NSIS
      shell: pwsh
      run: |
        if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed ($LASTEXITCODE)" }
        }
        # choco は PATH を更新しない場合がある。makensis が見つかるようにしておく。
        "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
    - name: Build exe and installer
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        makensis -VERSION
        wails3 package VERSION="${VERSION#v}"
