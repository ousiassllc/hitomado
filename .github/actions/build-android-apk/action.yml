name: Build the release APK
description: >-
  release APK（arm64）を作って android:verify で検査し、output へ置く。先に .github/actions/setup-android を実行しておく。
  署名鍵は入力で決まる（ロジックは .github/scripts/prepare-android-signing.sh、手順は docs/environment/android.md §4.1）。
  固定鍵の 4 つの入力（GitHub Secrets の値）が揃っていればその鍵で署名する。版が変わっても署名が同じなので、上書きインストールで更新できる。
  4 つとも空なら、このジョブの中だけの使い捨ての鍵で署名する（フォークの PR など。版ごとに署名が変わる）。
  require-fixed-key が true か 1（大文字小文字は問わない）のときは、固定鍵が無ければ使い捨ての鍵に落とさず失敗する（リリースの公開用）。false・0・空は要求しない。それ以外の値は誤記として失敗する。
  一部だけ設定されているときは、どちらでも失敗する。鍵とパスワードは成果物に含めない（keystore は $RUNNER_TEMP に置くだけで、ランナーはジョブごとに破棄される）。
inputs:
  version:
    description: 版番号。X.Y.Z でも vX.Y.Z（タグ）でもよい（先頭の v は外す）
    required: true
  output:
    description: 検査済みの APK を置くパス（親ディレクトリは作る）
    required: true
  keystore-base64:
    description: 固定鍵の keystore（.jks）を base64 にしたもの（Secrets ANDROID_KEYSTORE_BASE64）。空なら使い捨ての鍵
    required: false
    default: ""
  keystore-password:
    description: keystore のパスワード（Secrets ANDROID_KEYSTORE_PASSWORD）
    required: false
    default: ""
  key-alias:
    description: 鍵のエイリアス（Secrets ANDROID_KEY_ALIAS）
    required: false
    default: ""
  key-password:
    description: 鍵のパスワード（Secrets ANDROID_KEY_PASSWORD）
    required: false
    default: ""
  require-fixed-key:
    description: true か 1（大文字小文字は問わない）のとき、固定鍵が無ければ失敗する（使い捨ての鍵で公開しない）。false・0・空は要求しない。それ以外の値は誤記として失敗する
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Prepare the signing key
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
        KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEY_PASSWORD: ${{ inputs.key-password }}
        REQUIRE_FIXED_KEY: ${{ inputs.require-fixed-key }}
      run: bash "${GITHUB_ACTION_PATH}/../../scripts/prepare-android-signing.sh"
    - name: Release APK (arm64)
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        OUTPUT: ${{ inputs.output }}
      run: |
        wails3 task android:package ARCH=arm64 VERSION="${VERSION#v}"
        EXPECT_SIGNING=release wails3 task android:verify VERSION="${VERSION#v}"
        mkdir -p "$(dirname "$OUTPUT")"
        mv bin/hitomado.apk "$OUTPUT"
