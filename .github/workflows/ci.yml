name: CI

# main への push は release.yml が（同じ CI を呼んだうえで）受ける。ここでも受けると同じ ref の
# concurrency グループで互いにキャンセルし合うため、push トリガーは置かない。
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WAILS_VERSION: v3.1.0
  SQLC_VERSION: v1.31.1
  GOLANGCI_LINT_VERSION: v2.12.2
  # Android ビルド（docs/environment/android.md）。NDK は build/android/Taskfile.yml の NDK_VERSION と同じ値にする。
  ANDROID_NDK_VERSION: 26.3.11579264
  ANDROID_BUILD_TOOLS_VERSION: 36.0.0
  BUNDLETOOL_VERSION: 1.18.3

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install tools
        env:
          CGO_ENABLED: "0"
        run: |
          go install -tags purego github.com/wailsapp/wails/v3/cmd/wails3@"${WAILS_VERSION}"
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@"${SQLC_VERSION}"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"${GOLANGCI_LINT_VERSION}"
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - name: go.mod / go.sum are tidy
        env:
          CGO_ENABLED: "0"
        run: go mod tidy -diff
      - name: Go lint
        env:
          CGO_ENABLED: "0"
        run: golangci-lint run
      # android タグ側（*_android.go）も検査する。GOOS=android は CGO なしでも型検査できる。
      - name: Go lint (android)
        env:
          CGO_ENABLED: "0"
          GOOS: android
          GOARCH: arm64
        run: golangci-lint run
      - name: Biome
        run: frontend/node_modules/.bin/biome ci
      - name: Type check
        run: bun run typecheck
        working-directory: frontend
      - name: Linterly
        run: frontend/node_modules/.bin/linterly check
      - name: Generated files are up to date
        env:
          CGO_ENABLED: "0"
        run: |
          sqlc generate
          wails3 generate bindings -f '-tags purego' -clean=true -ts -i
          git diff --exit-code
      # NOTICE（第三者ライセンスの表記）は go.mod / bun.lock から作る。依存を更新したら `bun .github/scripts/gen-notice.ts` で作り直す。
      - name: NOTICE is up to date
        run: bun .github/scripts/gen-notice.ts --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Go vet
        env:
          CGO_ENABLED: "0"
          GOFLAGS: ${{ matrix.os == 'ubuntu-latest' && '-tags=purego' || '' }}
        run: go vet ./...
      - name: Go test
        env:
          CGO_ENABLED: "0"
          GOFLAGS: ${{ matrix.os == 'ubuntu-latest' && '-tags=purego' || '' }}
        run: go test ./...
      - if: matrix.os == 'ubuntu-latest'
        run: bun install --frozen-lockfile
        working-directory: frontend
      - if: matrix.os == 'ubuntu-latest'
        run: bun test
        working-directory: frontend
      - if: matrix.os == 'ubuntu-latest'
        name: Release version script
        run: bash .github/scripts/next-version_test.sh
      - if: matrix.os == 'ubuntu-latest'
        name: Android ELF alignment check script
        run: bash build/android/scripts/check-elf-align_test.sh
      # prepare-android-signing.sh の単体テスト（keytool を使うので JDK を入れる）。
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: matrix.os == 'ubuntu-latest'
        name: Android signing key selection script
        run: bash .github/scripts/prepare-android-signing_test.sh

  # インストーラーまで作り、旧版 → 上書き → アンインストールを実機（windows-latest）で通す。
  # 版は 0.99.1（旧）と 0.99.2（新）の固定値で、リリースの版とは無関係。exe に埋め込まれた版を
  # 照合するため、他の文字列に現れにくい値にしている。
  build:
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the installer (old version)
        uses: ./.github/actions/build-installer
        with:
          version: 0.99.1
      - name: Keep the old build
        shell: bash
        run: |
          mv bin/hitomado-v0.99.1-windows-amd64-setup.exe old-setup.exe
          mv bin/hitomado.exe old-hitomado.exe
      - name: Build the installer (new version)
        shell: bash
        run: wails3 package VERSION=0.99.2
      - name: Installer lifecycle (install, refuse while running, overwrite, uninstall)
        shell: pwsh
        run: >-
          .github/scripts/test-installer.ps1 -Force
          -OldInstaller "$PWD\old-setup.exe" -OldVersion 0.99.1 -OldExe "$PWD\old-hitomado.exe"
          -NewInstaller "$PWD\bin\hitomado-v0.99.2-windows-amd64-setup.exe" -NewVersion 0.99.2
          -Exe "$PWD\bin\hitomado.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: hitomado-windows-amd64-setup
          path: bin/hitomado-v0.99.2-windows-amd64-setup.exe
          if-no-files-found: error
      # ARM64 の Windows 11（x64 エミュレーション）で同じ検証を通すための入力（下の installer-arm64）。
      - uses: actions/upload-artifact@v4
        with:
          name: installer-lifecycle-inputs
          path: |
            old-setup.exe
            old-hitomado.exe
            bin/hitomado.exe
            bin/hitomado-v0.99.2-windows-amd64-setup.exe
          retention-days: 1
          if-no-files-found: error

  # ARM64 の Windows 11 の実機（windows-11-arm）で、x64 版のインストーラーと exe を通す（#13）。
  # 同じ x64 の成果物を、build ジョブで作ったものから受け取って使う（ARM64 版のビルドは無い）。
  installer-arm64:
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installer-lifecycle-inputs
          path: in
      - name: Installer lifecycle on ARM64 (install, refuse while running, overwrite, uninstall)
        shell: pwsh
        run: >-
          .github/scripts/test-installer.ps1 -Force
          -OldInstaller "$PWD\in\old-setup.exe" -OldVersion 0.99.1 -OldExe "$PWD\in\old-hitomado.exe"
          -NewInstaller "$PWD\in\bin\hitomado-v0.99.2-windows-amd64-setup.exe" -NewVersion 0.99.2
          -Exe "$PWD\in\bin\hitomado.exe"
      - name: Smoke test (the x64 exe stays up for 15 seconds under emulation)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD\in\bin\hitomado.exe" -PassThru
          try {
            for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) { throw "the app exited early (code $($p.ExitCode))" }
            }
            "alive after 15s; MainWindowTitle='$($p.MainWindowTitle)'"
            if ($p.MainWindowTitle -ne 'Hitomado') { throw "no Hitomado window (title '$($p.MainWindowTitle)')" }
          } finally {
            if (-not $p.HasExited) { $p.Kill() }
          }

  # Android の APK と AAB を作る。署名は使い捨ての鍵（固定の実鍵は渡さない）。
  # PR のコードに実鍵を渡さない（PR が作る成果物を実鍵で署名させない）ため、ここでは Secrets を build-android-apk に渡さず、フォークの PR でも同じ動きにする。
  # 固定鍵での署名は release.yml（main への push）だけが行う（鍵の選択ロジックは prepare-android-signing_test.sh が検査する）。
  # この CI を workflow_call で呼ぶ release.yml（push）では動かさない（release.yml が同じ action でリリース用の APK を作る。二重に動かさない）。
  android:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android
      # SecureStore（資格情報の保管。Keystore の鍵の喪失からの復旧）の JVM 単体テスト。端末は要らない。
      - name: Java unit tests (SecureStore)
        run: wails3 task android:test
      # 鍵が無いとき: デバッグ鍵で署名される（task が警告を出す）。この経路も検査する。
      - name: Release APK signed with the debug key (fallback)
        run: |
          wails3 task android:package ARCH=arm64 VERSION=0.99.1
          EXPECT_SIGNING=debug wails3 task android:verify VERSION=0.99.1
      # 使い捨ての鍵を作って環境変数で渡し、release APK を作る（リリースと同じ action。鍵の入力を渡さないので使い捨ての鍵になる）。
      # 鍵はこのジョブの中だけに存在し、成果物には含めない。
      - name: Release APK (arm64, throwaway key)
        uses: ./.github/actions/build-android-apk
        with:
          version: 0.99.1
          output: bin/hitomado-arm64.apk
      - name: Release AAB (arm64 + x86_64)
        run: wails3 task android:bundle:fat VERSION=0.99.1
      - name: Validate the AAB
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar "${RUNNER_TEMP}/bundletool.jar" validate --bundle bin/hitomado.aab
          unzip -l bin/hitomado.aab | grep -E 'base/lib/(arm64-v8a|x86_64)/libwails.so'
      - uses: actions/upload-artifact@v4
        with:
          name: hitomado-android
          path: |
            bin/hitomado-arm64.apk
            bin/hitomado.aab
          if-no-files-found: error

  # macOS の .app（ad-hoc 署名）と zip を作って検査する（Apple Silicon は起動の確認つき。Intel はクロスビルドのみ）。
  # 署名・公証はしない。この CI を workflow_call で呼ぶ release.yml（push）では動かさない（release.yml が同じ action でリリース用に作る）。
  macos:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        uses: ./.github/actions/build-macos
        with:
          version: 0.99.1
          arch: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: hitomado-macos-${{ matrix.arch }}
          path: bin/hitomado-v0.99.1-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
