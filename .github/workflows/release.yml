name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  WAILS_VERSION: v3.1.0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install tools
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@"${WAILS_VERSION}"
      - name: Build
        shell: bash
        run: wails3 build
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path bin/hitomado.exe -DestinationPath "hitomado-${{ github.ref_name }}-windows-amd64.zip"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" "hitomado-${{ github.ref_name }}-windows-amd64.zip" bin/hitomado.exe --clobber
