name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  WAILS_VERSION: v3.1.0

jobs:
  # タグが指すコミットでも CI（lint・test・Windows ビルド）を必ず通す。
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [ci]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install tools
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@"${WAILS_VERSION}"
      - name: Build (version is injected from the tag)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: wails3 build VERSION="${TAG#v}"
      - name: Package
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          Compress-Archive -Path bin/hitomado.exe -DestinationPath "hitomado-$env:TAG-windows-amd64.zip"
          $hash = (Get-FileHash "hitomado-$env:TAG-windows-amd64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  hitomado-$env:TAG-windows-amd64.zip" | Out-File -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            hitomado-*-windows-amd64.zip
            SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes "${flags[@]}"
          gh release upload "$TAG" --repo "$REPO" --clobber hitomado-*-windows-amd64.zip SHA256SUMS.txt
