name: Release

# main に入るたびに、最新の v* タグから patch を 1 つ上げたタグと GitHub Release を作る。
# タグは publish ジョブが `gh release create --target` で作る（GITHUB_TOKEN で作ったタグは
# 別のワークフローを起動しないので、タグ push では動かさない）。
on:
  push:
    branches: [main]

# 同時に 2 つマージされても版番号がぶつからないよう、実行を 1 本ずつに直列化する。
# cancel-in-progress は false（公開途中のものを止めない）。待機中の run は最新の 1 本だけが残り、
# 間に挟まったコミットは単独のリリースにならず、次のリリースに含まれる。
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  WAILS_VERSION: v3.1.0

jobs:
  # 今回のコミットで公開するタグを決める（ロジックは .github/scripts/next-version.sh）。
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Next release tag
        id: next
        run: echo "tag=$(bash .github/scripts/next-version.sh "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

  # このコミットでも CI（lint・test・Windows ビルド）を必ず通す。
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [version, ci]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install tools
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@"${WAILS_VERSION}"
      - name: Build (version is injected from the tag)
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: wails3 build VERSION="${TAG#v}"
      - name: Package
        shell: pwsh
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          Compress-Archive -Path bin/hitomado.exe -DestinationPath "hitomado-$env:TAG-windows-amd64.zip"
          $hash = (Get-FileHash "hitomado-$env:TAG-windows-amd64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  hitomado-$env:TAG-windows-amd64.zip" | Out-File -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            hitomado-*-windows-amd64.zip
            SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # 再実行でも壊れないよう、Release が既にあれば作らず成果物だけ上書きする。
          # タグは --target のコミット（このワークフローを起動した main のコミット）に作られる。
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          gh release upload "$TAG" --repo "$REPO" --clobber hitomado-*-windows-amd64.zip SHA256SUMS.txt
