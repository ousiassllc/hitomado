name: Windows ARM64 probe

on:
  push:
    branches: [sweep/issues-90-13]
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS_VERSION: v3.1.0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-installer
        with:
          version: 0.99.1
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: |
            bin/hitomado.exe
            bin/hitomado-v0.99.1-windows-amd64-setup.exe

  arm64:
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: win-x64
          path: in
      - name: Environment
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object OsName,OsVersion,OsArchitecture,CsSystemType | Format-List
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Get-ChildItem -Recurse in | Select-Object FullName,Length
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv
      - name: x64 exe stays up for 15 seconds
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "$PWD\in\hitomado.exe" -PassThru
          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { "exited early: code $($p.ExitCode)"; exit 1 }
          }
          "alive after 15s; MainWindowTitle='$($p.MainWindowTitle)' handle=$($p.MainWindowHandle)"
          Get-Process | Where-Object { $_.ProcessName -like 'msedgewebview2*' } | Select-Object Id,ProcessName | Format-Table
          Get-ChildItem "$env:APPDATA\Hitomado" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName,Length
          $p.Kill()
      - name: Installer (as is)
        shell: pwsh
        continue-on-error: true
        run: |
          $r = Start-Process -FilePath "$PWD\in\hitomado-v0.99.1-windows-amd64-setup.exe" -ArgumentList '/S',"/D=$env:TEMP\hit" -Wait -PassThru
          "installer exit code: $($r.ExitCode)"
