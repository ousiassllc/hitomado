rules:
  # max_lines_per_file / max_lines_per_directory はデフォルト値（300/2000）を使う。
  # 特別な理由がない限り変更しない。
  # max_lines_per_file: 300
  # max_lines_per_directory: 2000
  warning_threshold: 10

count_mode: all
default_excludes: true
language: ja

# 生成コードなど明確な理由がある場合のみ追加する。
ignore:
  # ソースコードではないもの（仕様書・ライセンス全文・ロックファイル）。
  - "docs/**"
  - "LICENSE"
  - "NOTICE"
  - "frontend/bun.lock"
  # 生成物（Wails のバインディング・sqlc の出力）。
  - "frontend/bindings/**"
  - "internal/store/db/**"
  # Wails が出力する Android プロジェクト一式（Java・Gradle。試作 #81）。
  - "build/android/**"
